name: Release

# Two ways to release:
#
#  1. From GitHub: Actions › Release › Run workflow, enter a version such as
#     v0.2.0. The tests run on main, then the tag is created and the release
#     published.
#  2. From a terminal: git tag v0.2.0 && git push origin v0.2.0. The tests run
#     on the tagged commit, then the release is published.
#
# Both paths live in this one workflow because a tag pushed with the
# workflow's own GITHUB_TOKEN does not trigger other workflows.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.2.0 (add -rc.1 etc. for a pre-release)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: v
        name: Validate version and source commit
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT_VERSION"
            if [ "$REF" != "refs/heads/main" ]; then
              echo "::error::Run this workflow from the main branch (it was started on $REF)."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::error::Tag $tag already exists. Pick a new version."
              exit 1
            fi
            sha="$(git rev-parse HEAD)"
          else
            tag="$REF_NAME"
            sha="$(git rev-parse "refs/tags/$tag^{commit}")"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::\"$tag\" is not a valid version. Use vMAJOR.MINOR.PATCH, e.g. v0.2.0 or v0.2.0-rc.1."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$tag points at a commit that is not on main."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $sha" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - name: Test (race, includes end-to-end tests of the built binary)
        run: go test -race -timeout 300s ./...

  tag:
    name: Create tag
    needs: [prepare, test]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Push tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG (started by $ACTOR)"
          git push origin "refs/tags/$TAG"

  release:
    name: Publish release
    needs: [prepare, test, tag]
    # Runs after the tag job, or without it when the tag was pushed by hand.
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.test.result == 'success' &&
      (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.16.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.prepare.outputs.tag }}
